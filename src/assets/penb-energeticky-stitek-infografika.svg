  <text x="84" y="462" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">E</text>

  <!-- Class F -->
  <polygon points="60,490 700,490 720,514 700,538 60,538" fill="#F26522"/>
  <text x="84" y="522" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">F</text>

