  <text x="84" y="582" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">G</text>
  <text x="900" y="582" font-family="Arial, Helvetica, sans-serif" font-size="20" font-style="italic" fill="#777777">nejnáročnější</text>

  <!-- House + certification badge icon -->
  <polygon points="950,320 1050,220 1150,320" fill="none" stroke="#0036A3" stroke-width="6" stroke-linejoin="round"/>
  <rect x="970" y="320" width="160" height="130" fill="none" stroke="#0036A3" stroke-width="6"/>
  <rect x="1030" y="390" width="40" height="60" fill="none" stroke="#0036A3" stroke-width="5"/>
  <rect x="990" y="340" width="30" height="30" fill="none" stroke="#0036A3" stroke-width="4"/>
  <rect x="1090" y="340" width="30" height="30" fill="none" stroke="#0036A3" stroke-width="4"/>
  <circle cx="1140" cy="440" r="34" fill="#E12333"/>
  <path d="M 1123 440 L 1135 452 L 1159 426" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="1150" y="70" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#0036A3">Radek Větrovský | RE/MAX</text>
  <text x="1150" y="612" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#999999">radek-vetrovsky.cz</text>
