<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#FAFAFA"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#E5E5E5" stroke-width="2"/>

  <text x="60" y="112" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#0036A3">PENB</text>
  <text x="60" y="150" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#555555">Průkaz energetické náročnosti budovy, třídy A až G</text>

  <!-- Class A -->
  <polygon points="60,190 340,190 360,214 340,238 60,238" fill="#1D8A3D"/>
