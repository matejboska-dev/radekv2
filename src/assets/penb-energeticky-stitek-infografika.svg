  <polygon points="60,310 460,310 480,334 460,358 60,358" fill="#8DC63F"/>
  <text x="84" y="342" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">C</text>

